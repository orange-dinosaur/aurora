name: Release

on:
  push:
    branches:
      - next
      - release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  prepare:
    needs: checks
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v7

      - name: Find or create the draft release
        id: release
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          tag="v$version"
          tree=$(git rev-parse 'HEAD^{tree}')
          releases="repos/$GITHUB_REPOSITORY/releases"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh api "$releases/tags/$tag" > /dev/null 2>&1; then
            echo "::error::$tag is already published. Raise the version in src-tauri/Cargo.toml."
            exit 1
          fi

          # Drafts have no tag yet, so several can share one. Work by id from here on: the
          # release list can lag behind a create or delete.
          drafts=$(gh api --paginate "$releases" \
            --jq ".[] | select(.draft and .tag_name == \"$tag\") | {id, body}")

          release_id=""
          if [ "$GITHUB_REF_NAME" = release ]; then
            release_id=$(jq -rn --arg tree "tree: $tree" \
              '[inputs | select((.body // "") | contains($tree)) | .id] | first // empty' <<< "$drafts")
          fi

          if [ -n "$release_id" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            for id in $(jq -r .id <<< "$drafts"); do
              gh api -X DELETE "$releases/$id"
            done
            release_id=$(gh api -X POST "$releases" --jq .id \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="Aurora $version" \
              -f body="<!-- tree: $tree -->" -F draft=true)
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles deb,rpm
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: true

  verify:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}

    steps:
      - name: Download latest.json from the draft
        run: |
          releases="repos/$GITHUB_REPOSITORY/releases"
          assets=$(gh api "$releases/$RELEASE_ID" --jq '.assets[] | {id, name}')
          jq -r .name <<< "$assets"

          id=$(jq -rn '[inputs | select(.name == "latest.json") | .id] | first // empty' <<< "$assets")
          if [ -z "$id" ]; then
            echo "::error::The draft has no latest.json."
            exit 1
          fi
          gh api -H 'Accept: application/octet-stream' "$releases/assets/$id" > latest.json

      # An installed rpm or deb asks for its own key before the plain linux-x86_64 one.
      - name: Check latest.json covers every platform
        run: |
          jq '.platforms | keys' latest.json
          jq -e '.platforms | has("darwin-aarch64") and has("darwin-x86_64") and has("linux-x86_64-deb") and has("linux-x86_64-rpm") and has("windows-x86_64")' latest.json

  publish:
    needs: [prepare, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.ref == 'refs/heads/release' }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}

    steps:
      - name: Publish the draft
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /dev/null \
            -F draft=false -f make_latest=true -f target_commitish="$GITHUB_SHA"
