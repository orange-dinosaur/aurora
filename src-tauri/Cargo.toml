[package]
name = "aurora"
version = "0.1.0"
description = "Aurora is an application for writers to help them organize their ideas and write their stories."
license = "MIT"
authors = ["orange-dinosaur"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aurora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Declared so the fixture generator can sit beside it without cargo guessing.
[[bin]]
name = "aurora"
path = "src/main.rs"

# Builds a throwaway project to measure against. Behind a feature so an
# ordinary build, and the bundle, never compile it.
[[bin]]
name = "fixture"
path = "src/fixture.rs"
required-features = ["fixture"]

[features]
fixture = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde-well-known"] }
uuid = { version = "1", features = ["v4", "serde"] }
trash = "5.2.7"

[dev-dependencies]
tempfile = "3"
