<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
	<!-- Apple's proportions for an app icon: an 824 square inset by 100, corners
	     at 185. macOS draws a tile of its own behind anything that is not this
	     shape, so the icon brings its own, and the other systems get the same
	     one. -->
	<rect x="100" y="100" width="824" height="824" rx="185" fill="#FAFDFE" />
	<circle cx="433.76" cy="511.96" r="256.70" fill="#F79E17" fill-opacity="0.75" />
	<circle cx="304.37" cy="547.45" r="128.35" fill="#F60808" fill-opacity="0.65" />
	<circle cx="642.46" cy="552.66" r="205.57" fill="#4B48D2" fill-opacity="0.65" />
</svg>
